
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>For Acaa, My Love ❤️</title>  
<link rel="stylesheet" href="style.css">

</head>

<body>

  <main id="birthday-app">

    <section id="password-screen">
      <div class="password-card">

        <div class="flower-icon">🌸</div>

        <h1>For You, My Love</h1>
        <p>Enter our special date</p>

       
<div id="pin-display">
  <span>○</span>
  <span>○</span>
  <span>○</span>
  <span>○</span>
  <span>○</span>
  <span>○</span>
</div>


       
<div id="keypad">
  <button data-digit="1">1</button>
  <button data-digit="2">2</button>
  <button data-digit="3">3</button>
  <button data-digit="4">4</button>
  <button data-digit="5">5</button>
  <button data-digit="6">6</button>
  <button data-digit="7">7</button>
  <button data-digit="8">8</button>
  <button data-digit="9">9</button>
  <button data-action="clear">C</button>
  <button data-digit="0">0</button>
  <button data-action="delete">⌫</button>
</div>


        <p id="pin-message"></p>

      </div>
    </section>

   
<section id="gift-screen" style="display: none;">
  <div class="password-card">
    <div class="gift-box" id="gift-box" role="button" tabindex="0" aria-label="Buka kotak hadiah">
      <div class="gift-lid"></div>
      <div class="gift-ribbon"></div>
      <div class="gift-body">🎁</div>
    </div>

    <h1>Happy Birthday, Acaa!</h1>
    <p>A little surprise, made with all my love.</p>
    <p class="gift-hint">Tap the gift to open it 💗</p>

    <div id="gift-message" style="display: none;">
      <p>You are my favorite person in the world. 💖</p>
      <p>Every moment with you is a gift to me.</p>
      <p>Today, tomorrow, and always — I choose you. ❤️</p>
    </div>
  </div>
</section>


  </main>
<script src="script.js"></script>
</body>

</html>
